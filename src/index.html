<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SALTY DOG | ドッグトリマー・エディトリアルカルテシステム</title>
  <link rel="icon" href="/assets/app-icon.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <style>
    :root {
      --bg-page: #f8f8f7;
      --bg-surface: #ffffff;
      --bg-subtle: #f2f2ef;
      --bg-muted: #e9e9e5;
      --bg-dark: #0f0f0f;
      --bg-paper: #faf9f6;

      --ink-primary: #121212;
      --ink-body: #2c2c2c;
      --ink-secondary: #585858;
      --ink-muted: #8c8c88;
      --ink-inverse: #ffffff;

      --border-subtle: #e6e6e2;
      --border-divider: #deded9;
      --border-strong: #121212;

      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic Medium", "Yu Gothic", Meiryo, sans-serif;
      --font-en: "Inter", -apple-system, sans-serif;
      --font-serif: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Times New Roman", serif;

      --ease-editorial: cubic-bezier(0.16, 1, 0.3, 1);
      --header-height: 54px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      background-color: var(--bg-page);
      color: var(--ink-body);
      font-family: var(--font-sans);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Nav Glass */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      height: var(--header-height);
      background: rgba(12, 12, 12, 0.72);
      backdrop-filter: blur(28px) saturate(200%) brightness(105%);
      -webkit-backdrop-filter: blur(28px) saturate(200%) brightness(105%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: none;
      color: var(--ink-inverse);
    }
    .top-nav__container {
      max-width: 1280px;
      height: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-nav__brand {
      font-family: var(--font-serif);
      font-size: 14px;
      letter-spacing: 0.14em;
      color: #ffffff;
    }

    /* Hero Auth Container */
    .auth-hero-wrapper {
      min-height: calc(100vh - var(--header-height));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f4f4f0 100%);
    }

    .auth-hero-card {
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    .auth-brand-badge {
      display: inline-block;
      font-family: var(--font-en);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: var(--ink-muted);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .auth-brand-title {
      font-family: var(--font-serif);
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 0.16em;
      color: var(--ink-primary);
      margin-bottom: 18px;
    }

    .auth-hero-copy {
      font-family: var(--font-serif);
      font-size: 16px;
      line-height: 2.1;
      letter-spacing: 0.08em;
      color: var(--ink-primary);
      margin-bottom: 28px;
    }

    .auth-hero-image-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      margin: 0 auto 32px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(0,0,0,0.06);
    }

    .auth-hero-image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .auth-hero-image-tag {
      position: absolute;
      bottom: 12px;
      left: 14px;
      font-family: var(--font-en);
      font-size: 10.5px;
      letter-spacing: 0.12em;
      color: #ffffff;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
    }

    /* Architectural Boxbutton */
    .boxbutton {
      align-items: center;
      background-color: #000000;
      border: 1px solid #000000;
      color: #ffffff;
      display: inline-flex;
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.2;
      min-height: 60px;
      padding: 14px 64px 14px 24px;
      position: relative;
      text-decoration: none;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.14);
      transition: background-color 0.2s ease, transform 0.15s ease;
      user-select: none;
    }
    .boxbutton:before {
      background-color: rgba(255, 255, 255, 0.28);
      content: "";
      display: block;
      height: 100%;
      position: absolute;
      right: 52px;
      top: 0;
      width: 1px;
    }
    .boxbutton:after {
      background-color: #ffffff;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      content: "";
      display: block;
      height: 10px;
      position: absolute;
      right: 22px;
      top: calc(50% - 5px);
      width: 9px;
      transition: transform 0.2s ease;
    }
    .boxbutton:hover:after { transform: translateX(4px); }
    .boxbutton:hover { background-color: #1a1a1a; transform: translateY(-2px); }

    .demo-note {
      margin-top: 20px;
      font-size: 11.5px;
      color: var(--ink-muted);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="top-nav__container">
      <span class="top-nav__brand">SALTY DOG</span>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: rgba(255,255,255,0.7);">ENTRANCE</span>
    </div>
  </nav>

  <div class="auth-hero-wrapper">
    <div class="auth-hero-card">
      <span class="auth-brand-badge">Trimmer & Owner Record</span>
      <h1 class="auth-brand-title">SALTY DOG</h1>
      
      <p class="auth-hero-copy">
        愛犬の暮らしと健康を美しく記録し、<br>
        あなたと愛犬にとって豊かな未来をつくる
      </p>

      <div class="auth-hero-image-frame">
        <img src="/assets/photo-trim-action.jpg" alt="トリミング風景">
        <div class="auth-hero-image-tag">SALTY DOG ATELIER</div>
      </div>

      <a href="/my" class="boxbutton" data-entry-login>
        <div style="display: flex; align-items: center; gap: 14px;">
          <svg width="22" height="22" viewBox="0 0 18 18">
            <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z"/>
            <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
            <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z"/>
            <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z"/>
          </svg>
          <span>Google でログイン</span>
        </div>
      </a>

      <p class="demo-note" data-demo-note>※ KVデモ版では認証を行いません</p>
    </div>
  </div>

  <script type="module" src="/js/supabase-auth.js"></script>
</body>
</html>
