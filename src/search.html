<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>カルテ検索・一覧 | SALTY DOG</title>
  <link rel="icon" href="/assets/app-icon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-page: #f8f8f7;
      --bg-surface: #ffffff;
      --bg-subtle: #f2f2ef;
      --bg-muted: #e9e9e5;
      --bg-paper: #faf9f6;

      --ink-primary: #121212;
      --ink-body: #2c2c2c;
      --ink-secondary: #585858;
      --ink-muted: #8c8c88;
      --ink-inverse: #ffffff;

      --border-subtle: #e6e6e2;
      --border-divider: #deded9;
      --border-strong: #121212;

      --accent-alert: #d32f2f;
      --accent-alert-bg: #fde8e8;
      --accent-sage: #4a7c59;

      --font-sans: "Noto Sans JP", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-en: "Inter", -apple-system, sans-serif;
      --font-serif: "Noto Serif JP", "Times New Roman", serif;

      --ease-editorial: cubic-bezier(0.16, 1, 0.3, 1);
      --header-height: 54px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100vh;
      background-color: var(--bg-page);
      color: var(--ink-body);
      font-family: var(--font-sans);
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Nav Glass */
    .top-nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      height: var(--header-height);
      background: rgba(12, 12, 12, 0.72);
      backdrop-filter: blur(28px) saturate(200%) brightness(105%);
      -webkit-backdrop-filter: blur(28px) saturate(200%) brightness(105%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: none;
      color: var(--ink-inverse);
    }
    .top-nav__container {
      max-width: 1280px;
      height: 100%;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.24);
      color: #ffffff;
      padding: 5px 12px;
      font-family: var(--font-en);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-home:hover { background: #ffffff; color: #000000; }
    .top-nav__brand { font-family: var(--font-serif); font-size: 14px; letter-spacing: 0.14em; color: #ffffff; }

    /* Directory Container */
    .directory-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    /* Sticky Search & Voice Bar */
    .search-sticky-box {
      position: sticky;
      top: calc(var(--header-height) + 12px);
      z-index: 800;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      margin-bottom: 20px;
    }

    .search-input-row {
      display: flex;
      align-items: center;
    }

    .search-icon-wrap {
      padding: 0 16px;
      color: var(--ink-muted);
      display: flex;
      align-items: center;
    }

    .search-input {
      flex: 1;
      min-height: 52px;
      padding: 0 8px;
      font-size: 15px;
      color: var(--ink-primary);
      outline: none;
      border: none;
      background: transparent;
    }

    .btn-search-mic {
      min-height: 52px;
      padding: 0 18px;
      border-left: 1px solid var(--border-subtle);
      background: var(--bg-subtle);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
    }
    .btn-search-mic:hover { background: var(--bg-muted); }
    .btn-search-mic.is-recording {
      background: var(--accent-alert);
      color: #ffffff;
      animation: pulseRecording 1.2s infinite;
    }
    @keyframes pulseRecording { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

    .filter-chips-row {
      display: flex;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border-subtle);
      background: var(--bg-paper);
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filter-chips-row::-webkit-scrollbar { display: none; }

    .filter-chip {
      padding: 5px 12px;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }
    .filter-chip.is-active, .filter-chip:hover {
      background: var(--ink-primary);
      color: #ffffff;
      border-color: var(--ink-primary);
    }

    .directory-header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 16px 4px 12px;
      border-bottom: 2px solid var(--ink-primary);
      margin-bottom: 12px;
    }

    .directory-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    /* Result List */
    .result-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .result-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      background: #ffffff;
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      color: inherit;
    }
    .result-row:hover {
      border-color: var(--ink-primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }

    .row-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      background: var(--bg-muted);
      flex: 0 0 auto;
      border: 1px solid var(--border-subtle);
      margin-right: 14px;
    }
    .row-avatar img { width: 100%; height: 100%; object-fit: cover; }

    .row-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .pet-name-line {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .pet-name { font-size: 16px; font-weight: 700; color: var(--ink-primary); }
    .owner-name { font-size: 13px; font-weight: 600; color: var(--ink-secondary); }
    .meta-line {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 11.5px;
      color: var(--ink-muted);
    }

    .badge-alert {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--accent-alert-bg);
      color: var(--accent-alert);
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 6px;
    }

    .boxbutton {
      align-items: center;
      background-color: #000000;
      border: 1px solid #000000;
      color: #ffffff;
      display: inline-flex;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      min-height: 42px;
      padding: 8px 44px 8px 16px;
      position: relative;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
      user-select: none;
    }
    .boxbutton:before {
      background-color: rgba(255, 255, 255, 0.28);
      content: "";
      display: block;
      height: 100%;
      position: absolute;
      right: 36px;
      top: 0;
      width: 1px;
    }
    .boxbutton:after {
      background-color: #ffffff;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      content: "";
      display: block;
      height: 8px;
      position: absolute;
      right: 14px;
      top: calc(50% - 4px);
      width: 7px;
      transition: transform 0.2s ease;
    }
    .boxbutton:hover:after { transform: translateX(3px); }

    .boxbutton--white {
      background-color: #ffffff;
      border: 1px solid #111111;
      color: #111111;
    }
    .boxbutton--white:before { background-color: #deded9; }
    .boxbutton--white:after { background-color: #111111; }
    .boxbutton--white:hover { background-color: #111111; color: #ffffff; }
    .boxbutton--white:hover:after { background-color: #ffffff; }
    .boxbutton--full { width: 100%; }

    .empty-state { text-align: center; padding: 48px 0; color: var(--ink-muted); font-size: 14px; }
  </style>
</head>
<body>
  <nav class="top-nav">
    <div class="top-nav__container">
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="index.html" class="btn-home">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          HOME
        </a>
        <span style="color: rgba(255,255,255,0.25);">/</span>
        <span class="top-nav__brand">カルテ検索・一覧</span>
      </div>
      <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: rgba(255,255,255,0.7);">DIRECTORY</span>
    </div>
  </nav>

  <div class="directory-container">
    
    <div class="search-sticky-box">
      <div class="search-input-row">
        <div class="search-icon-wrap">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
        <input
          id="search-input"
          type="text"
          placeholder="飼い主名・ワンちゃん名・犬種で検索..."
          class="search-input"
          autocomplete="off"
          oninput="filterDogs(this.value)"
        />
        <button class="btn-search-mic" id="search-mic-btn" onclick="toggleVoiceSearch()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          <span id="search-mic-label">音声検索</span>
        </button>
      </div>

      <div class="filter-chips-row">
        <span class="filter-chip is-active" onclick="quickFilter('all', this)">すべて</span>
        <span class="filter-chip" onclick="quickFilter('ポンチ', this)">ポンチ（塩田様）</span>
        <span class="filter-chip" onclick="quickFilter('モモ', this)">モモ</span>
        <span class="filter-chip" onclick="quickFilter('レオ', this)">レオ</span>
        <span class="filter-chip" onclick="quickFilter('要ケア', this)">⚠️ 要注意</span>
      </div>
    </div>

    <div class="directory-header-row">
      <h2 class="directory-title">登録カルテ</h2>
      <span style="font-size: 12.5px; color: var(--ink-muted);" id="result-count">21 件</span>
    </div>

    <ul class="result-list" id="result-list" role="list"></ul>
    
    <div class="empty-state" id="empty-state" style="display:none">
      <p id="empty-text"></p>
    </div>

    <div style="margin-top: 28px;">
      <a href="design-samples/ponchi-v2.html" class="boxbutton boxbutton--white boxbutton--full">
        <span>＋ 新規カルテを作成する</span>
      </a>
    </div>

  </div>

  <script>
    function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

    const DOGS = [
      { owner: '塩田 様', pet: 'ポンチ', reading: 'ぽんち', breed: 'トイプードル', sub: '2026/08/15', avatar: '/assets/photo-dog-paw-high.jpg', alert: '⚠️ 前回未記入: 爪状態' },
      { owner: '佐藤 花子', pet: 'モモ', reading: 'もも', breed: '柴犬', sub: '2026/05/30', avatar: '/assets/dog-poodle.jpg' },
      { owner: '田中 一郎', pet: '桃',   reading: 'もも', breed: 'ポメラニアン', sub: '2026/05/28', avatar: '/assets/photo-trim-action.jpg' },
      { owner: '鈴木 美咲', pet: 'もも', reading: 'もも', breed: 'ミニチュアダックス', sub: '2026/05/25', avatar: '/assets/dog-doodle.jpg' },
      { owner: '伊藤 大輔', pet: 'レオ', reading: 'れお', breed: 'ゴールデンドゥードル', sub: '2026/05/18', avatar: '/assets/dog-doodle.jpg' },
      { owner: '山本 彩',   pet: 'レオ', reading: 'れお', breed: 'チワワ', sub: '2026/05/15', avatar: '/assets/dog-poodle.jpg' },
      { owner: '中村 翔',   pet: 'ココ', reading: 'ここ', breed: 'ビションフリーゼ', sub: '2026/05/13', avatar: '/assets/photo-dog-paw-high.jpg' },
      { owner: '小林 葵',   pet: 'ハナ', reading: 'はな', breed: 'ヨークシャーテリア', sub: '2026/05/12', avatar: '/assets/photo-trim-action.jpg' },
      { owner: '加藤 蓮',   pet: 'ソラ', reading: 'そら', breed: 'フレンチブルドッグ', sub: '2026/05/11', avatar: '/assets/dog-poodle.jpg' },
      { owner: '吉田 凛',   pet: 'マロン', reading: 'まろん', breed: 'マルチーズ', sub: '2026/05/10', avatar: '/assets/dog-doodle.jpg' }
    ];

    function normalize(s) {
      return (s || '').replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60)).toLowerCase();
    }

    function filterDogs(query) {
      const q = normalize(query.trim());
      const matched = q
        ? DOGS.filter(d =>
            normalize(d.pet).includes(q) ||
            normalize(d.reading).includes(q) ||
            normalize(d.owner).includes(q) ||
            normalize(d.breed).includes(q) ||
            (q.includes('要ケア') && d.alert)
          )
        : DOGS;
      render(matched, query);
    }

    function render(list, query) {
      const countEl = document.getElementById('result-count');
      const listEl  = document.getElementById('result-list');
      const emptyEl = document.getElementById('empty-state');
      const emptyTxt = document.getElementById('empty-text');

      if (list.length === 0) {
        listEl.innerHTML = '';
        countEl.textContent = '0 件';
        emptyTxt.textContent = '「' + query + '」に一致するカルテが見つかりません';
        emptyEl.style.display = '';
      } else {
        emptyEl.style.display = 'none';
        countEl.textContent = list.length + ' 件';
        listEl.innerHTML = list.map(d => `
          <li>
            <div class="result-row" onclick="selectDog('${escHtml(d.pet)}')">
              <div class="row-avatar">
                <img src="${d.avatar || '/assets/photo-dog-paw-high.jpg'}" alt="${escHtml(d.pet)}">
              </div>
              <div class="row-main">
                <div class="pet-name-line">
                  <span class="pet-name">${escHtml(d.pet)}</span>
                  <span class="owner-name">${escHtml(d.owner)}</span>
                  <span style="font-size:11.5px; color:var(--ink-muted);">（${escHtml(d.breed)}）</span>
                </div>
                <div class="meta-line">
                  <span>最終来店: <strong>${escHtml(d.sub)}</strong></span>
                  ${d.alert ? `<span class="badge-alert">${escHtml(d.alert)}</span>` : '<span style="color:var(--accent-sage); font-weight:700;">✓ 前回完了</span>'}
                </div>
              </div>
              <button type="button" class="boxbutton" style="min-height:36px; padding:6px 36px 6px 12px; font-size:12px;">選択</button>
            </div>
          </li>
        `).join('');
      }
    }

    function selectDog(name) {
      window.location.href = 'design-samples/ponchi-v2.html';
    }

    function quickFilter(key, chipEl) {
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('is-active'));
      chipEl.classList.add('is-active');
      const input = document.getElementById('search-input');
      if (key === 'all') {
        input.value = '';
        filterDogs('');
      } else {
        input.value = key;
        filterDogs(key);
      }
    }

    function toggleVoiceSearch() {
      const btn = document.getElementById('search-mic-btn');
      const label = document.getElementById('search-mic-label');
      const input = document.getElementById('search-input');

      btn.classList.add('is-recording');
      label.textContent = '録音中...';

      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        const rec = new SpeechRec();
        rec.lang = 'ja-JP';
        rec.onresult = (e) => {
          const text = e.results[0][0].transcript;
          input.value = text;
          filterDogs(text);
          btn.classList.remove('is-recording');
          label.textContent = '音声検索';
        };
        rec.onerror = () => {
          btn.classList.remove('is-recording');
          label.textContent = '音声検索';
        };
        rec.start();
      } else {
        setTimeout(() => {
          input.value = 'ポンチ';
          filterDogs('ポンチ');
          btn.classList.remove('is-recording');
          label.textContent = '音声検索';
        }, 1200);
      }
    }

    render(DOGS, '');
  </script>
</body>
</html>
