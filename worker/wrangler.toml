# SALTY DOG Beauty Report 公開 Worker
#
# ██ 移設元にあったデプロイ凍結は、このリポジトリには引き継がれていない。 ██
#
#   凍結の理由は「src/ が静的モックに置換されており、デプロイすると本番の稼働
#   アプリが潰れる」ことだった。siota-1 は src/ に v1（本番と同世代）を置いて
#   いるため、その前提は成立しない。よって predeploy-guard.mjs と
#   deploy-freeze.md は移設していない（docs/ops/plans/2026-08-21-migration.md）。
#
#   ただしデプロイ自体は移設・統合フェーズのスコープ外。実行前に必ずマスターの
#   承認を取ること。
#
# デプロイ: worker/ ディレクトリで `npx wrangler deploy`（このファイルが参照される）
# 事前準備:
#   npx wrangler kv namespace create REPORTS   # 作成済み（下記 id）
# ※ WRITE_TOKEN は廃止（無認証化済み）
name = "saltydog-report-worker"
main = "src/index.js"
compatibility_date = "2025-01-01"

# ██ workers.dev を無効化する。██
#
#   この Worker は KV モード（`/api/config` が backend:"kv"）で動き、その API 群は
#   **無認証**である（`src/index.js` の `/api/customers` `/api/owners` `/api/reports` は
#   GET / POST / DELETE のいずれも認証チェックを持たない。無認証化は当時の意図的な設計）。
#
#   F6 でカスタムドメインのルートは Supabase 版へ移したが、**workers.dev のサブドメインは
#   ルートとは別物**なので、`https://saltydog-report-worker.<sub>.workers.dev/api/customers`
#   が誰でも叩ける状態のまま残っていた。実際に 200 で顧客一覧が返ることを確認した
#   （2026-08-24）。読み取りだけでなく `DELETE /api/owners/{slug}` によるカスケード削除も
#   無認証で通る。
#
#   D-20260823-09 の「切り戻せるように Worker は残す」は維持したまま、外から叩けない
#   ようにする。切り戻しはカスタムドメインの route を戻す操作なので、workers.dev を
#   閉じても切り戻し能力は失われない。
workers_dev = false
preview_urls = false

# Static Assets: ../dist 配下を Worker に同梱（ponchi-v2.html 注入配信用）
# Worker ルート（/p/* /o/* /api/* /edit/*）が優先処理し、それ以外は Assets フォールスルーで配信。
[assets]
directory = "../dist"
binding = "ASSETS"

# KV namespace binding（コード内 env.REPORTS）
[[kv_namespaces]]
binding = "REPORTS"
id = "50241192b25149eb8f846653ecae8f64"

# ██ ルートは 2026-08-23（F6）に Supabase 版 Worker（shiota0823）へ移した。 ██
#
#   独自ドメイン trimmer-system.kouheikosehira.com/* を処理するのは
#   worker/wrangler.supabase.toml の shiota0823 である。この KV 版 Worker
#   （saltydog-report-worker）は**削除せず残してある**が、ルートを持たないので
#   どのドメインからも呼ばれない（docs/decisions.md D-20260823-09）。
#
#   切り戻しが要る場合は、逆順で行う:
#     1. wrangler.supabase.toml の [[routes]] を消して deploy（新から外す）
#     2. 下の [[routes]] を復活させて deploy（旧に戻す）
#     3. Supabase の Site URL / Redirect URLs を workers.dev へ戻す
#
# [[routes]]
# pattern = "trimmer-system.kouheikosehira.com/*"
# zone_name = "kouheikosehira.com"
