# 毒見の3種類目「配信物が空」専用（`node scripts/poison-run.mjs --flavor=nodist`）。
#
# **配る側を空にしないと作れない毒。** 土台（Supabase）をいくら壊しても、
# 静的配信と未ログイン画面の検査は変わらない——`docs/ops/proof-of-red.md` の
# 「両方の毒でも判定できない15件」がそれ。ここは `dist/` の代わりに
# **空のディレクトリ**を配る。この世界では「/my が配信される」「4画面が乗っている」
# のような検査が、**赤にならなければ嘘をついている**。
#
# `wrangler.local.toml` からの差分は `directory` の1行だけ。
# デプロイには使わない（`wrangler dev` 専用）。

# ローカル Supabase（`supabase start`）向けの Worker 設定。
#
# CLOUDFLARE_API_TOKEN も、ホスト済み Supabase プロジェクトの service role key も
# 無くても、実ブラウザ・実DB・実RLSでの検証を回せるようにするためのもの。
# `supabase/seed.sql` のローカル専用テストアカウント（password login）と対で使う。
# デプロイ用ではない（`wrangler dev` でのみ使用）。ここに書く値は
# Supabase CLI のローカル開発用デフォルト鍵（`supabase start` の出力そのもの）で、
# 本番の秘密情報ではない。
name = "shiota0823-local"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "../.poison-dist"
binding = "ASSETS"

[vars]
SUPABASE_REPORT_ASSETS_BUCKET = "report-assets"
SUPABASE_URL = "http://127.0.0.1:54321"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH"
