# Supabase 版 Worker（shiota0823）。
#
# 独自ドメインには紐付けない。デプロイ先は workers.dev のサブドメインで、
# 現行本番（wrangler.toml の trimmer-system.kouheikosehira.com / KV モード）とは
# 完全に別物として並走する。production route、KV namespace、
# service role key をこのファイルへ追加しない。
#
# ここに書く2つの値はどちらも公開情報である。SUPABASE_URL はブラウザの
# 通信先として誰にでも見え、publishable key は「匿名で入れる」ことを前提に
# 発行された鍵で、実際のアクセス制御は DB 側の RLS が行う。
# service_role key と secret key は別物であり、絶対にここへ書かない。
name = "shiota0823"

# ██ workers.dev のサブドメインを明示的に閉じる（納品前診断 #94）。██
#
#   実測では既に 404（"There is nothing here yet"）だが、**設定に書いていなかった**。
#   wrangler の既定は true で、route を足しても自動では閉じない（公式ドキュメント）。
#   つまり「いまたまたま閉じている」状態だった。独自ドメイン以外の入口を持たない、
#   と設定に書いておく——次に誰かがデプロイしても開かない。
workers_dev = false
main = "src/index.js"
compatibility_date = "2025-01-01"

# 独自ドメイン（F6・2026-08-23）。ここを処理していた KV 版 Worker
# （saltydog-report-worker）はルートを外して残してある——切り戻せる状態を
# 捨てない（docs/decisions.md D-20260823-09）。切り戻し手順は
# worker/wrangler.toml のコメントに書いてある。
# 全パス（/*）を Worker が一本で処理する。静的アセットは [assets] fallthrough で配信。
[[routes]]
pattern = "trimmer-system.kouheikosehira.com/*"
zone_name = "kouheikosehira.com"

[assets]
directory = "../dist"
binding = "ASSETS"

# **`/` だけは Worker に先に通す。**
#
# `[assets]` は既定で「静的ファイルが在れば Worker を呼ばずに配る」。`/` は
# `dist/index.html` に当たるため、**Worker の `fetch` は `/` について一度も
# 走っていなかった**。2026-09-02 に「入口を1つにする」として Worker 側へ
# `renderLoginPage` を足したが、この設定のせいで**到達不能なまま**で、
# 本番の `/` は素の HTML（練習用の犬・ログインしないボタン）を配り続けた
# （`F-20260902-66`）。コードを直しても設定がこれでは効かない。
#
# 配列で「この道だけ」を指定する。他は今までどおり静的ファイルが先なので、
# 画像や js の配信コストは変わらない。
run_worker_first = ["/"]

[vars]
DATA_BACKEND = "supabase"
SUPABASE_REPORT_ASSETS_BUCKET = "report-assets"
SUPABASE_URL = "https://bcodloqwnrhcuvevfguy.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_jdfWplKTWyEEqNYn4gcBvQ_yvmoKIml"
